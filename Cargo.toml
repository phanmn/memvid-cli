[package]
edition = "2021"
rust-version = "1.85.0"
name = "memvid-cli"
version = "2.0.137"
build = "build.rs"
exclude = [
    "web/node_modules/",
    "web/src/",
    "web/public/",
    "tests/",
    "examples/",
    "target/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Command-line interface for Memvid v2 - AI memory with crash-safe, single-file storage"
documentation = "https://docs.memvid.com"
readme = "README.md"
keywords = [
    "ai",
    "memory",
    "cli",
    "search",
    "embeddings",
]
categories = [
    "command-line-utilities",
    "database",
]
license = "Apache-2.0"
repository = "https://github.com/memvid/memvid"

[features]
accelerate = [
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
    "memvid-core/accelerate",
]
audio-playback = ["dep:rodio"]
candle-llm = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
clip = ["memvid-core/clip"]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "memvid-core/cuda",
]
default = [
    "temporal_track",
    "temporal_enrich",
    "parallel_segments",
    "candle-llm",
    "llama-cpp",
    "clip",
    "logic_mesh",
    "whisper",
    "replay",
    "encryption",
    "local-embeddings",
    "vec",
]
encryption = ["memvid-core/encryption"]
extractous = ["memvid-core/extractous"]
llama-cpp = [
    "dep:llama_cpp",
    "memvid-ask-model/llama-cpp",
]
local-embeddings = ["dep:fastembed"]
logic_mesh = ["memvid-core/logic_mesh"]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "memvid-core/metal",
]
parallel_segments = ["memvid-core/parallel_segments"]
pdfium = ["memvid-core/pdfium"]
replay = ["memvid-core/replay"]
temporal_enrich = ["memvid-core/temporal_enrich"]
temporal_track = ["memvid-core/temporal_track"]
vec = ["memvid-core/vec"]
web = [
    "dep:axum",
    "dep:tower-http",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:rust-embed",
    "dep:mime_guess",
]
whisper = ["memvid-core/whisper"]

[lib]
name = "memvid_cli"
path = "src/lib.rs"

[[bin]]
name = "memvid"
path = "src/main.rs"

